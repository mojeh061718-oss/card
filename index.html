<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c0c10" />
    <meta name="apple-mobile-web-app-title" content="Cardboard" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash-1206x2622.png"
    />
    <title>Cardboard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { background: #0c0c10; color: #f4f2ec; height: 100%; overscroll-behavior: none; }
      body {
        font-family: -apple-system, "Helvetica Neue", sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-user-select: none; user-select: none;
      }
      #root { height: 100%; }
      /* Standalone launch: no rubber-band, no text zoom on rotate. */
      html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
      input, textarea { -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
